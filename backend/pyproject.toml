[project]
name = "resume-screener"
version = "1.0.0"
description = "Explainable, gaming-resistant resume screening engine (SBERT + NLP + integrity checks)"
readme = "../README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "torch>=2.3",
    "sentence-transformers>=3.0",
    "spacy>=3.8,<3.9",
    "en-core-web-sm",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "lxml>=5.0",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs a running PostgreSQL + pgvector (docker compose up -d db)",
    "slow: loads SBERT / spaCy models",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`:Warning"]
